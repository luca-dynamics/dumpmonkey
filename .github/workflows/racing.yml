name: Racing validation

on:
  pull_request:
    paths: ['game/**', 'tools/**', '.github/workflows/racing.yml']

permissions:
  contents: read

jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned official engine
        run: |
          mkdir -p .tools/godot
          cd .tools/godot
          curl -fsSL --retry 3 -o Godot_v4.7.2-stable_linux.x86_64.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          curl -fsSL --retry 3 -o SHA512-SUMS.txt https://github.com/godotengine/godot/releases/download/4.7.2-stable/SHA512-SUMS.txt
          sha512sum --check --ignore-missing SHA512-SUMS.txt
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Install matching web templates
        run: node tools/fetch-web-templates.mjs --install
      - name: Import project
        run: .tools/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --editor --import --quit
      - name: Verify riding and race rules
        run: .tools/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/run_tests.gd
      - name: Verify scene integration
        run: .tools/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/integration.gd
      - name: Verify onboarding and first ride
        run: .tools/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/onboarding.gd
      - name: Export browser build
        run: |
          mkdir -p game/build/web
          .tools/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --export-release Web build/web/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: crew-yard-web
          path: game/build/web
